<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupon Database</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface2: #f0ede6;
      --border: #e0dbd0;
      --text: #1a1814;
      --text2: #6b6659;
      --text3: #9c9484;
      --accent: #c84b2f;
      --accent-bg: #fdf0ec;
      --green: #2a7a4b;
      --green-bg: #edf7f1;
      --amber: #b5620a;
      --amber-bg: #fef3e2;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --radius: 10px;
      --radius-lg: 16px;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ── */
    header {
      background: var(--text);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header svg { flex-shrink: 0; }
    header h1 {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }
    header span {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      min-height: calc(100vh - 57px);
    }

    /* ── Scanner Panel ── */
    .scanner-panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Camera View ── */
    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #111;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .camera-wrap video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .aim-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .aim-box {
      width: 65%; aspect-ratio: 2.2/1;
      border: 1.5px solid rgba(255,255,255,0.75);
      border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.38);
    }
    .aim-box::before, .aim-box::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: #fff;
      border-style: solid;
    }
    .scan-flash {
      position: absolute; inset: 0;
      background: rgba(42,122,75,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }
    .scan-hint {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.85);
      font-size: 11px;
      font-family: var(--mono);
      padding: 3px 12px;
      border-radius: 99px;
      white-space: nowrap;
    }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 6px; }
    button {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
      display: flex; align-items: center; gap: 6px;
    }
    button:hover { background: var(--surface2); border-color: #ccc; }
    button:active { opacity: 0.75; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary {
      background: var(--text); color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-danger {
      background: var(--accent-bg); color: var(--accent);
      border-color: #f0c4b8;
    }
    .btn-danger:hover { background: #fde4dc; }

    /* ── Result Box ── */
    .result-box {
      background: var(--green-bg);
      border: 1px solid #b6e5cc;
      border-radius: var(--radius);
      padding: 12px 14px;
      display: none;
    }
    .result-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--green);
      margin-bottom: 5px;
    }
    .result-value {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
    }
    .result-format {
      font-size: 11px;
      color: var(--text3);
      margin-top: 4px;
    }
    .result-actions { display: flex; gap: 6px; margin-top: 10px; }

    /* ── Manual Entry ── */
    .manual-entry { display: flex; gap: 6px; }
    .manual-entry input {
      flex: 1;
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .manual-entry input:focus { border-color: var(--text); }
    .manual-entry input::placeholder { color: var(--text3); }

    /* ── Error Box ── */
    .error-box {
      background: var(--accent-bg);
      border: 1px solid #f0c4b8;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent);
      display: none;
      font-family: var(--mono);
    }

    /* ── Database Panel ── */
    .db-panel {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .db-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .db-header .panel-title { border: none; padding: 0; flex: 1; }

    .search-bar {
      display: flex; gap: 8px; align-items: center;
    }
    .search-bar input {
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      outline: none;
      width: 220px;
    }
    .search-bar input:focus { border-color: var(--text); }
    .search-bar input::placeholder { color: var(--text3); }

    .stats-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      min-width: 90px;
    }
    .stat-card .stat-num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
    }
    .stat-card .stat-lbl {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    /* ── Coupon Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    th {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text3);
      padding: 10px 16px;
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .td-barcode {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .badge-green { background: var(--green-bg); color: var(--green); border-color: #b6e5cc; }
    .badge-amber { background: var(--amber-bg); color: var(--amber); border-color: #f9d9aa; }

    .note-input {
      font-family: var(--sans);
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      width: 140px;
      outline: none;
      cursor: pointer;
    }
    .note-input:hover { border-color: var(--border); background: var(--surface2); }
    .note-input:focus { border-color: var(--text); background: var(--surface); cursor: text; }
    .note-input::placeholder { color: var(--text3); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }
    .empty-state p { font-size: 14px; margin-top: 8px; }

    .ts { font-size: 11px; color: var(--text3); font-family: var(--mono); }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .scanner-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .db-panel { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
    <rect x="1" y="4" width="2" height="14" fill="white"/>
    <rect x="4" y="4" width="1" height="14" fill="white"/>
    <rect x="6" y="4" width="2" height="14" fill="white"/>
    <rect x="9.5" y="4" width="1" height="14" fill="white"/>
    <rect x="11.5" y="4" width="2.5" height="14" fill="white"/>
    <rect x="15" y="4" width="1" height="14" fill="white"/>
    <rect x="17" y="4" width="2" height="14" fill="white"/>
    <rect x="20" y="4" width="1" height="14" fill="white"/>
  </svg>
  <h1>Coupon Database</h1>
  <span id="header-count">0 coupons stored</span>
</header>

<div class="layout">

  <!-- ── Scanner Panel ── -->
  <div class="scanner-panel">
    <div class="panel-title">Barcode Scanner</div>

    <div class="camera-wrap">
      <video id="preview" playsinline muted></video>
      <div class="aim-overlay">
        <div class="aim-box"></div>
      </div>
      <div class="scan-flash" id="flash"></div>
      <div class="scan-hint" id="scan-hint">Camera off</div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-start" onclick="startScan()" style="flex:1;">
        ▶ Start camera
      </button>
      <button id="btn-stop" onclick="stopScan()" disabled style="flex:1;">
        ⏸ Stop
      </button>
      <button onclick="document.getElementById('file-input').click()" title="Upload image">
        ↑ Image
      </button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="scanFromFile(event)">
    </div>

    <div class="result-box" id="result-box">
      <div class="result-label">✓ Barcode detected</div>
      <div class="result-value" id="result-value"></div>
      <div class="result-format" id="result-format"></div>
      <div class="result-actions">
        <button onclick="saveCurrent()" class="btn-primary" style="flex:1;">+ Save to database</button>
        <button onclick="copyResult()" id="btn-copy">Copy</button>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>

    <div>
      <div class="panel-title" style="margin-bottom:10px;">Manual entry</div>
      <div class="manual-entry">
        <input type="text" id="manual-input" placeholder="Type or paste barcode value..." onkeydown="if(event.key==='Enter')saveManual()">
        <button onclick="saveManual()" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- ── Database Panel ── -->
  <div class="db-panel">
    <div class="db-header">
      <div class="panel-title">Stored Coupons</div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search barcodes or notes..." oninput="renderTable()">
        <button onclick="exportCSV()">↓ Export CSV</button>
        <button onclick="clearAll()" class="btn-danger">Clear all</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-lbl">Total coupons</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-today">0</div>
        <div class="stat-lbl">Added today</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-formats">0</div>
        <div class="stat-lbl">Unique formats</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Barcode value</th>
            <th>Format</th>
            <th>Note</th>
            <th>Added</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state">
        <div style="font-size:32px;">⬛</div>
        <p>No coupons yet. Scan or type a barcode to get started.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
  // ── State ──
  let coupons = JSON.parse(localStorage.getItem('coupons') || '[]');
  let codeReader = null;
  let lastScanned = null;
  let currentResult = null;

  // ── Persistence ──
  function save() {
    localStorage.setItem('coupons', JSON.stringify(coupons));
    renderTable();
    updateStats();
  }

  // ── Scanner ──
  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = msg;
    b.style.display = 'block';
  }
  function hideError() { document.getElementById('error-box').style.display = 'none'; }

  function triggerFlash() {
    const f = document.getElementById('flash');
    f.style.opacity = '1';
    setTimeout(() => f.style.opacity = '0', 280);
  }

  function showResult(text, format) {
    if (text === lastScanned) return;
    lastScanned = text;
    currentResult = { text, format };
    triggerFlash();
    document.getElementById('result-value').textContent = text;
    document.getElementById('result-format').textContent = 'Format: ' + (format || 'unknown');
    document.getElementById('result-box').style.display = 'block';
    hideError();
  }

  async function startScan() {
    hideError();
    lastScanned = null;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('scan-hint').textContent = 'Starting…';

    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93, ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.RSS_14, ZXing.BarcodeFormat.RSS_EXPANDED,
        ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.AZTEC,
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      codeReader = new ZXing.BrowserMultiFormatContinuousReader(hints);
      const devices = await codeReader.listVideoInputDevices();
      let deviceId = devices[0]?.deviceId;
      const rear = devices.find(d => /back|rear|environment/i.test(d.label));
      if (rear) deviceId = rear.deviceId;

      await codeReader.decodeContinuouslyFromVideoDevice(deviceId, 'preview');
      codeReader.onDecodeResult = (result) => {
        if (result) showResult(result.getText(), result.getBarcodeFormat()?.toString());
      };
      document.getElementById('scan-hint').textContent = 'Align barcode within the frame';
    } catch (e) {
      showError('Camera error: ' + (e.message || e));
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('scan-hint').textContent = 'Camera error';
    }
  }

  function stopScan() {
    if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled = true;
    document.getElementById('scan-hint').textContent = 'Camera off';
  }

  async function scanFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    hideError();
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      const url = URL.createObjectURL(file);
      const result = await reader.decodeFromImageUrl(url);
      URL.revokeObjectURL(url);
      showResult(result.getText(), result.getBarcodeFormat()?.toString());
    } catch(e) {
      showError('Could not read barcode. Try better lighting or a closer shot.');
    }
    event.target.value = '';
  }

  function copyResult() {
    const val = document.getElementById('result-value').textContent;
    navigator.clipboard.writeText(val).then(() => {
      const b = document.getElementById('btn-copy');
      b.textContent = '✓ Copied';
      setTimeout(() => b.textContent = 'Copy', 1500);
    });
  }

  // ── Database ──
  function saveCurrent() {
    if (!currentResult) return;
    addCoupon(currentResult.text, currentResult.format);
    document.getElementById('result-box').style.display = 'none';
    currentResult = null;
    lastScanned = null;
  }

  function saveManual() {
    const val = document.getElementById('manual-input').value.trim();
    if (!val) return;
    addCoupon(val, 'Manual');
    document.getElementById('manual-input').value = '';
  }

  function addCoupon(barcode, format) {
    const now = new Date();
    coupons.unshift({
      id: Date.now(),
      barcode,
      format: format || 'unknown',
      note: '',
      added: now.toISOString(),
    });
    save();
  }

  function deleteCoupon(id) {
    coupons = coupons.filter(c => c.id !== id);
    save();
  }

  function updateNote(id, note) {
    const c = coupons.find(c => c.id === id);
    if (c) { c.note = note; save(); }
  }

  function clearAll() {
    if (!confirm('Delete all coupons? This cannot be undone.')) return;
    coupons = [];
    save();
  }

  function exportCSV() {
    const rows = [['#', 'Barcode', 'Format', 'Note', 'Added']];
    coupons.forEach((c, i) => rows.push([i+1, c.barcode, c.format, c.note, c.added]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'coupons.csv';
    a.click();
  }

  function renderTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = coupons.filter(c =>
      c.barcode.toLowerCase().includes(q) || c.note.toLowerCase().includes(q)
    );

    const tbody = document.getElementById('table-body');
    const empty = document.getElementById('empty-state');

    if (filtered.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      tbody.innerHTML = filtered.map((c, i) => {
        const d = new Date(c.added);
        const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const fmtClass = c.format === 'Manual' ? 'badge-amber' : 'badge-green';
        return `<tr>
          <td class="ts">${i + 1}</td>
          <td class="td-barcode">${escHtml(c.barcode)}</td>
          <td><span class="badge ${fmtClass}">${escHtml(c.format)}</span></td>
          <td><input class="note-input" value="${escHtml(c.note)}" placeholder="Add note…"
            onchange="updateNote(${c.id}, this.value)"
            onblur="updateNote(${c.id}, this.value)"></td>
          <td class="ts">${dateStr}<br>${timeStr}</td>
          <td><button onclick="deleteCoupon(${c.id})" title="Delete" style="padding:4px 8px; color:var(--accent); border-color:#f0c4b8;">✕</button></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('header-count').textContent = `${coupons.length} coupon${coupons.length !== 1 ? 's' : ''} stored`;
  }

  function updateStats() {
    const today = new Date().toDateString();
    const todayCount = coupons.filter(c => new Date(c.added).toDateString() === today).length;
    const formats = new Set(coupons.map(c => c.format)).size;
    document.getElementById('stat-total').textContent = coupons.length;
    document.getElementById('stat-today').textContent = todayCount;
    document.getElementById('stat-formats').textContent = formats;
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──
  renderTable();
  updateStats();
</script>
</body>
</html>
